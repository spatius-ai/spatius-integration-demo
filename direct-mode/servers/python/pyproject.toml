[project]
name = "direct-mode-server"
version = "0.2.0"
description = "Direct Mode backend for Spatius AvatarKit: session tokens plus a realtime voice agent"
requires-python = ">=3.10,<3.15"
dependencies = [
  "flask>=3.0.0",
  "flask-cors>=4.0.0",
  "httpx>=0.28.1",
  "python-dotenv>=1.0.0",
  # Realtime scene. The agent runs as a worker process next to this server; audio
  # comes back over the client's WebSocket rather than an RTC track, so the browser
  # needs no LiveKit SDK of its own.
  "livekit-agents>=1.0",
  "livekit-api>=0.8",
  "websockets>=12.0",
]
